<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Arcana Smart School</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f8fafc; /* putih ke abu-abu sangat muda -- basis netral */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* ============================================================
       BACKGROUND -- gumpalan warna (hijau/kuning/biru) yang blur &
       melayang pelan, kesan "berkelas" bukan rame/norak. Kartu login
       tetap jadi fokus utama, background cuma aksen halus di belakang.
       ============================================================ */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    .bg-blob.biru {
      width: 480px; height: 480px;
      background: #3b82f6;
      top: -140px; left: -120px;
      animation: mengambang1 14s ease-in-out infinite;
    }
    .bg-blob.hijau {
      width: 420px; height: 420px;
      background: #22c55e;
      bottom: -160px; right: -100px;
      animation: mengambang2 16s ease-in-out infinite;
    }
    .bg-blob.kuning {
      width: 320px; height: 320px;
      background: #facc15;
      bottom: 10%; left: -80px;
      opacity: 0.35;
      animation: mengambang3 12s ease-in-out infinite;
    }
    @keyframes mengambang1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 60px) scale(1.08); }
    }
    @keyframes mengambang2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -40px) scale(1.1); }
    }
    @keyframes mengambang3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.05); }
    }

    /* ============================================================
       KARTU LOGIN -- masuk dengan animasi fade + naik pelan, kaca
       buram (glass) tipis di atas background blob supaya tetap
       kebaca jelas & kesannya premium/clean.
       ============================================================ */
    .login-container {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 38px 32px;
      border-radius: 20px;
      width: 380px;
      border: 1px solid rgba(203, 213, 225, 0.6);
      box-shadow: 0 20px 45px -10px rgba(30, 41, 59, 0.15), 0 8px 16px -8px rgba(30, 41, 59, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(28px);
      animation: kartuMasuk 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes kartuMasuk {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Garis aksen tipis 3 warna di bagian atas kartu -- identitas
       "hijau, kuning, biru" tanpa harus norak di seluruh kartu. */
    .login-container::before {
      content: "";
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 4px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, #22c55e 0%, #facc15 50%, #3b82f6 100%);
      background-size: 200% 100%;
      animation: geserGradasi 6s linear infinite;
    }
    @keyframes geserGradasi {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .logo {
      width: 130px;
      margin-bottom: 14px;
      object-fit: contain;
      opacity: 0;
      animation: logoMasuk 0.6s ease-out 0.15s forwards;
    }
    @keyframes logoMasuk {
      from { opacity: 0; transform: scale(0.8) rotate(-6deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    h2 {
      color: #1e293b;
      margin: 0 0 4px 0;
      font-size: 22px;
      font-weight: 700;
      opacity: 0;
      animation: teksMasuk 0.5s ease-out 0.3s forwards;
    }
    .subtitle {
      color: #64748b;
      font-size: 12.5px;
      margin: 0 0 18px 0;
      font-weight: 500;
      opacity: 0;
      animation: teksMasuk 0.5s ease-out 0.4s forwards;
    }
    @keyframes teksMasuk {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Field-field form masuk berurutan (stagger) biar terasa halus,
       bukan muncul serentak sekaligus. */
    .field {
      opacity: 0;
      transform: translateY(10px);
      animation: fieldMasuk 0.5s ease-out forwards;
    }
    .field:nth-of-type(1) { animation-delay: 0.5s; }
    .field:nth-of-type(2) { animation-delay: 0.6s; }
    .field:nth-of-type(3) { animation-delay: 0.7s; }
    @keyframes fieldMasuk {
      to { opacity: 1; transform: translateY(0); }
    }

    label {
      text-align: left;
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background-color: #ffffff;
      font-size: 14px;
      outline: none;
      color: #1e293b;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    }

    select:hover, input:hover { border-color: #94a3b8; }

    /* Fokus biru (aksi utama), dengan sedikit "angkat" halus */
    select:focus, input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      transform: translateY(-1px);
    }

    /* Tombol Login -- gradasi hijau -> biru dengan efek "shine" yang
       menyapu saat hover, terasa premium tanpa berlebihan. */
    button {
      margin-top: 24px;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #16a34a 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      font-size: 15px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      opacity: 0;
      transform: translateY(10px);
      animation: fieldMasuk 0.5s ease-out 0.8s forwards;
      transition: box-shadow 0.25s ease, transform 0.1s ease;
      box-shadow: 0 8px 18px -6px rgba(37, 99, 235, 0.45);
    }
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.35) 50%, transparent 80%);
      transform: translateX(-120%);
      transition: transform 0.6s ease;
      z-index: -1;
    }
    button:hover::before { transform: translateX(120%); }
    button:hover {
      box-shadow: 0 10px 24px -6px rgba(37, 99, 235, 0.55);
    }
    button:active { transform: scale(0.98); }

    /* ============================================================
       FLASH MESSAGE (Flask) -- tetap goyang (shake) khusus error,
       sukses masuk dengan pop halus.
       ============================================================ */
    .flash-container {
      width: 100%;
      margin-top: 14px;
    }

    .flash-msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      font-weight: 500;
    }

    .flash-msg.error {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      animation: shake 0.45s ease-in-out;
    }

    .flash-msg.success {
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      animation: popMasuk 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes popMasuk {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ============================================================
       LINK BAWAH
       ============================================================ */
    .bottom-links {
      margin-top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      opacity: 0;
      animation: teksMasuk 0.5s ease-out 0.9s forwards;
    }

    .link {
      position: relative;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .link::after {
      content: "";
      position: absolute;
      left: 0; bottom: -2px;
      width: 0%;
      height: 1.5px;
      background: #2563eb;
      transition: width 0.25s ease;
    }
    .link:hover::after { width: 100%; }

    @media (max-width: 480px) {
      .login-container {
        width: 90%;
        padding: 28px 22px;
      }
      .bg-blob { display: none; }
    }
  </style>
</head>
<body>

<div class="bg-blob biru"></div>
<div class="bg-blob hijau"></div>
<div class="bg-blob kuning"></div>

<div class="login-container">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeyF2mMXxr-Rex9wZLBTU8eRGAelTMK_FPJ0aRJOxzUg&s " alt="Logo Sekolah" class="logo" />

  <h2>LOGIN SEKOLAH</h2>
  <p class="subtitle">Masuk untuk melanjutkan ke Arcana Smart School</p>

  <form id="loginForm" action="{{ url_for('login') }}" method="POST">

    <div class="field">
      <label for="role">Pilih Role</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>-- Pilih Role --</option>
        <option value="guru">Guru</option>
        <option value="siswa">Siswa</option>
        <option value="staf_kebersihan">Staf Kebersihan</option>
      </select>
    </div>

    <div class="field">
      <label for="username">Username / NISN / NIP</label>
      <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="off" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Masukkan password" required />
    </div>

    <button type="submit">Masuk ke Sistem</button>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash-msg {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

  </form>

  <div class="bottom-links">
    <a href="{{ url_for('lupa_password') }}" class="link">Lupa Password?</a>
    <a href="{{ url_for('register') }}" class="link">Buat Akun Baru</a>
  </div>
</div>

</body>
</html>
