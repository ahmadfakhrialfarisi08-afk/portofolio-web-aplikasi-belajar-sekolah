<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password - Arcana Smart School</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reset-container {
      background-color: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 130px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    h2 {
      color: #1e293b;
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    p.subtitle {
      color: #64748b;
      font-size: 12px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    label {
      text-align: left;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .flash-container {
      width: 100%;
      margin-top: 15px;
    }

    .flash-msg {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      font-weight: 500;
    }

    .flash-msg.success {
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .flash-msg.error {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .bottom-links {
      margin-top: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      font-size: 13px;
    }

    .link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="reset-container">
  <img src="https://smkba.sch.id/storage/settings/01KSS8AQ39D852VCW0SD8XDZPA.png" alt="Logo Sekolah" class="logo" />
  
  <h2>Reset Password</h2>
  <p class="subtitle">Lengkapi data akun Anda untuk menerima link reset kata sandi melalui email.</p>

  <form action="{{ url_for('lupa_password') }}" method="POST">
    
    <label for="role">Pilih Role</label>
    <select id="role" name="role" required>
      <option value="" disabled selected>-- Pilih Role --</option>
      <option value="guru">Guru</option>
      <option value="siswa">Siswa</option>
      <option value="staf_kebersihan">Staf Kebersihan</option>
    </select>

    <label for="username">Username / NISN / NIP</label>
    <input type="text" id="username" name="username" placeholder="Masukkan ID / Username" required autocomplete="off" />

    <label for="email">Alamat Email Terdaftar</label>
    <input type="email" id="email" name="email" placeholder="contoh: nama@sekolah.sch.id" required autocomplete="off" />

    <button type="submit">Kirim Link Reset PW</button>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash-msg {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

  </form>

  <div class="bottom-links">
    <a href="{{ url_for('login') }}" class="link">← Kembali ke Login</a>
  </div>
</div>

</body>
</html>
